# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== 生成 index.html ====================
      - name: Convert README.md to index.html
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          
          CURRENT_YEAR=$(date +%Y)
          
          # 处理 README.md（替换年份 + 链接）
          cp README.md temp.md
          sed -i "s/202[0-9]年/${CURRENT_YEAR}年/g" temp.md
          sed -i 's|https://[^ ]*|https://www.112112789.xyz/?code=uq27o1Ko|g' temp.md
          
          # 生成 index.html（纯白色背景）
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta name="description" content="${CURRENT_YEAR}年最新稳定高速VPN推荐 - 专为大陆用户打造">
              <title>${CURRENT_YEAR}年最新稳定高速VPN推荐</title>
              <link rel="stylesheet" href="https://47.243.132.233:3828/assets/css/index-20260328235813.css">
              <link rel="stylesheet" href="https://129.146.105.213/static/chatbot/widget/aibot-chat-widget.css">
              <style>
                  body {
                      background: #ffffff !important;
                      color: #333333;
                  }
                  img {
                      max-width: 100%;
                      height: auto;
                  }
              </style>
          </head>
          <body>
          EOF
          
          pandoc temp.md --from gfm --to html -s --section-divs >> index.html
          echo '</body></html>' >> index.html
          
          rm temp.md

      # ==================== 生成 sitemap.xml ====================
      - name: Generate sitemap.xml
        run: |
          CUSTOM_DOMAIN="https://v2ray.mud.de5.net"
          
          cat > sitemap.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>${CUSTOM_DOMAIN}/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      # ==================== 提交文件 ====================
      - name: Commit updated files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html sitemap.xml
          git commit -m "chore: auto update index.html and sitemap.xml" || echo "No changes to commit"
          git push
        continue-on-error: true

      # ==================== 部署 ====================
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
